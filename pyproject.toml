[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clawmio"
version = "0.0.1"
description = "WeChat iLink to Bailian Managed Agent bridge with an interactive CLI"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dynamic = ["dependencies"]

[project.scripts]
clawmio = "clawmio.cli:main"

[tool.setuptools]
packages = ["app", "clawmio"]
include-package-data = false

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}
