name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: node --check static/app.js
      - run: bash -n start.sh
      - run: python scripts/package_skill.py
      - run: python scripts/check_repository.py
      - run: python -m pip install build
      - run: python -m build
      - run: python scripts/check_distribution.py dist/clawmio-0.0.1-py3-none-any.whl
      - run: bash -n deploy/linux-release/install.sh deploy/linux-release/clawmio
      - run: python scripts/package_release.py
